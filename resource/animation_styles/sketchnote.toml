name = "Sketchnote"
summary = "Visual notes on cream paper: ink doodles, boxes and arrows with soft highlighter colour."
direction = '''
- Surface: cream notebook paper (#fdf6e3), optionally with faint dot grid.
- Ink: #2b2b2b outlines 7-9px with round joins. Colour is highlighter only:
  flat blocks of yellow #ffe066, mint #96f2d7 or coral #ffa8a8 sitting slightly
  off-register behind the ink, never filling it exactly.
- Build the page from note elements: boxed keywords, banners, arrows, bullet
  dots, small icons, connected into a little map.
- Type: Nunito 800 for keywords in upper case, at most three words per scene.
- Motion: elements arrive in reading order: a highlighter block wipes in
  (scaleX from 0), its ink outline draws, the word pops, an arrow draws to the
  next item. Finish with a small wiggle on the newest item.
'''
example = '''
```css
#sn-page { position: absolute; inset: 0; background: #fdf6e3; }
#sn-hl { position: absolute; left: 215px; top: 300px; width: 690px; height: 200px; background: #ffe066; border-radius: 10px; }
#sn-word { position: absolute; left: 0; top: 315px; width: 100%; text-align: center; font: 800 130px Nunito, sans-serif; color: #2b2b2b; }
#sn-art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#sn-art .sn-ink { fill: none; stroke: #2b2b2b; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; }
#sn-dot1, #sn-dot2 { position: absolute; width: 220px; height: 220px; border-radius: 50%; top: 980px; }
#sn-dot1 { left: 170px; background: #96f2d7; }
#sn-dot2 { left: 690px; background: #ffa8a8; }
```
```html
