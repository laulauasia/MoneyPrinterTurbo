name = "Ink Wash"
summary = "Chinese ink painting: soft grey washes and a few black brush strokes on rice paper, with one red seal."
direction = '''
- Surface: rice paper (#f3efe4). Most of the frame stays empty: the empty
  paper is mist, water and sky.
- Ink only: black #1a1a1a thinned to greys (opacity 0.15-0.8). Washes are
  soft-edged blobs: blur them (filter: blur(14-30px)) or run them through an
  inline SVG feTurbulence + feDisplacementMap filter so edges bleed. Brush
  strokes are tapered paths, thick where the brush lands and thin where it
  lifts. The only colour is one small vermilion seal (#c8281e) and at most a
  hint of pale red for blossom or sun.
- Subjects: layered mountains fading with distance (nearest darkest), a lone
  pine, bamboo stalks with leaf strokes, a small boat, birds as two flicks.
- Type: Noto Sans JP 700 or Playfair Display 700 in ink black, small and off
  to one side, at most three words; the seal sits below it.
- Motion: ink arrives like ink: washes bloom (scale from 0.6 with opacity
  rising slowly), strokes are painted along their length, mist layers drift
  sideways very slowly. Long sine eases; nothing snaps.
'''
example = '''
