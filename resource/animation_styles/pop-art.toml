name = "Pop Art"
summary = "Loud comic-book colour, halftone dots, thick black outlines and starburst shouts."
direction = '''
- Surface: a flat saturated colour (yellow #ffd60a, cyan #00b4d8 or red
  #ef233c) covered by a halftone dot pattern (an SVG pattern of circles, or a
  radial-gradient repeated at 36px) in a second colour.
- Palette: yellow, cyan, red, magenta #ff2e93, plus black and white. Every
  shape has a thick black outline (12-16px) and a hard offset black shadow
  (a copy shifted 16px down-right), never a soft one.
- Vocabulary: starburst and speech-bubble shapes, lightning bolts, repeated
  panels of the same object in different colours, diagonal stripes.
- Type: Archivo Black, upper case, white or yellow with a black outline
  (-webkit-text-stroke) and hard shadow, tilted a few degrees, one or two words.
- Motion: punchy. Things slam in with back.out or elastic.out, bursts spin a
  little, colours of repeated panels swap on the beat. Then shapes keep
  pulsing in scale.
'''
example = '''
```css
#pa-page { position: absolute; inset: 0; background-color: #ffd60a; background-image: radial-gradient(#ef233c 28%, transparent 30%); background-size: 40px 40px; }
#pa-art { position: absolute; left: 40px; top: 420px; width: 1000px; height: 1000px; }
#pa-shadow { fill: #111111; }
#pa-burst { fill: #00b4d8; stroke: #111111; stroke-width: 14; stroke-linejoin: round; }
#pa-tilt { position: absolute; left: 0; top: 780px; width: 100%; text-align: center; }
#pa-word { display: inline-block; font: 400 230px "Archivo Black", sans-serif; color: #ffffff; -webkit-text-stroke: 10px #111111; text-shadow: 14px 14px 0 #111111; letter-spacing: 4px; }
```
```html
<div id="pa-page" class="clip" data-start="0" data-duration="4" data-track-index="0">
  <svg id="pa-art" viewBox="0 0 1000 1000">
    <g id="pa-star">
      <polygon id="pa-shadow" points="520,60 610,290 850,170 780,420 1000,520 780,620 850,870 610,750 520,980 430,750 190,870 260,620 40,520 260,420 190,170 430,290" />
      <polygon id="pa-burst" points="500,40 590,270 830,150 760,400 980,500 760,600 830,850 590,730 500,960 410,730 170,850 240,600 20,500 240,400 170,150 410,270" />
    </g>
  </svg>
  <div id="pa-tilt"><div id="pa-word">POW!</div></div>
</div>
```
```js
tl.fromTo("#pa-star", { scale: 0, rotation: -90, svgOrigin: "500 500" }, { scale: 1, rotation: 0, duration: 0.6, ease: "back.out(1.8)" }, 0.1);
tl.fromTo("#pa-word", { scale: 0, rotation: -24 }, { scale: 1, rotation: -8, duration: 0.5, ease: "elastic.out(1, 0.5)" }, 0.5);
tl.fromTo("#pa-star", { rotation: 0, svgOrigin: "500 500" }, { rotation: 20, duration: 2.8, ease: "none" }, 0.9);
tl.fromTo("#pa-word", { scale: 1 }, { scale: 1.12, duration: 0.35, ease: "sine.inOut", yoyo: true, repeat: 7 }, 1.1);
```
