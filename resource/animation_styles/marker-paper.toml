tl.fromTo("#mp-sun", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.8, ease: "power1.inOut" }, 1.4);
tl.fromTo("#mp-ink", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 0.5 }, 2.1);
tl.fromTo("#mp-word", { opacity: 0, y: -60 }, { opacity: 1, y: 0, duration: 0.4, ease: "back.out(2)" }, 2.4);
tl.fromTo("#mp-art", { rotation: 0, y: 0 }, { rotation: -2, y: -30, duration: 1.0, ease: "sine.inOut" }, 2.8);
