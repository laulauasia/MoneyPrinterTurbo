tl.fromTo("#ri-yellow", { scale: 0 }, { scale: 1, duration: 0.6, ease: "power2.out" }, 0.1);
tl.fromTo("#ri-pink", { x: -900 }, { x: 0, duration: 0.6, ease: "power3.out" }, 0.5);
tl.fromTo("#ri-blue", { y: -1100 }, { y: 0, duration: 0.6, ease: "power3.out" }, 0.9);
tl.fromTo("#ri-word", { opacity: 0, y: -40 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 1.3);
tl.fromTo("#ri-pink", { rotation: 0 }, { rotation: 14, duration: 2.3, ease: "sine.inOut" }, 1.5);
tl.fromTo("#ri-blue", { x: 0 }, { x: -60, duration: 2.3, ease: "sine.inOut" }, 1.5);
```
