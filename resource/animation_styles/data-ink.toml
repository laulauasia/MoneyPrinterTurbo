name = "Data Ink"
summary = "Dark dashboard look: charts, numbers and thin grid lines with one glowing accent. For facts and figures."
direction = '''
- Every scene is a chart, a counter, a gauge or a diagram. Show quantities and
  relationships, never decoration.
- Dark field (#0b0f1a) with a faint grid of 1px lines at 6% white. Marks in
  cool grey-blue; exactly one accent (#3ddc97) for the value that matters.
- Thin, precise shapes: 2-6px strokes, square bar ends, small round markers.
- Type: JetBrains Mono for numbers and labels, Inter 700 for one headline.
  Numbers are the largest thing on screen.
- Motion: bars grow from their baseline, lines draw left to right, markers
  fade in after their line arrives (power2.out, 0.6-1s, 0.1s stagger). After
  that, the accent mark pulses in opacity so the frame stays alive.
'''
example = '''
```css
#di-stage { position: absolute; inset: 0; background-color: #0b0f1a; background-image: linear-gradient(rgba(255, 255, 255, 0.06) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.06) 1px, transparent 1px); background-size: 90px 90px; }
#di-head { position: absolute; left: 100px; top: 250px; font: 700 78px Inter, sans-serif; color: #dfe6f3; }
#di-value { position: absolute; left: 100px; top: 360px; font: 700 190px "JetBrains Mono", monospace; color: #3ddc97; }
.di-bar { position: absolute; bottom: 560px; width: 150px; background: #5b6b8c; }
#di-b1 { left: 110px; height: 220px; }
#di-b2 { left: 340px; height: 380px; }
#di-b3 { left: 570px; height: 520px; }
#di-b4 { left: 800px; height: 700px; background: #3ddc97; }
#di-base { position: absolute; left: 90px; bottom: 554px; width: 900px; height: 4px; background: #dfe6f3; }
```
```html
<div id="di-stage" class="clip" data-start="0" data-duration="4" data-track-index="0">
  <div id="di-head">Savings by year</div>
  <div id="di-value">4x</div>
  <div id="di-b1" class="di-bar"></div>
  <div id="di-b2" class="di-bar"></div>
  <div id="di-b3" class="di-bar"></div>
  <div id="di-b4" class="di-bar"></div>
  <div id="di-base"></div>
</div>
```
```js
tl.fromTo("#di-base", { scaleX: 0, transformOrigin: "0% 50%" }, { scaleX: 1, duration: 0.6, ease: "power2.out" }, 0);
tl.fromTo("#di-head", { opacity: 0 }, { opacity: 1, duration: 0.5 }, 0.2);
tl.fromTo(".di-bar", { scaleY: 0, transformOrigin: "50% 100%" }, { scaleY: 1, duration: 0.8, ease: "power2.out", stagger: 0.12 }, 0.4);
tl.fromTo("#di-value", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power2.out" }, 1.3);
tl.fromTo("#di-value", { scale: 1 }, { scale: 1.06, duration: 0.9, ease: "sine.inOut", repeat: 1, yoyo: true }, 2.0);
```
