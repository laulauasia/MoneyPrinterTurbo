  <svg id="sn-art" viewBox="0 0 1080 1920">
    <rect id="sn-box" class="sn-ink" x="190" y="285" width="700" height="200" rx="14" pathLength="1" />
    <path id="sn-a1" class="sn-ink" d="M420 500 Q330 700 290 950 M250 890 L290 955 L345 905" pathLength="1" />
    <path id="sn-a2" class="sn-ink" d="M660 500 Q760 700 795 950 M740 905 L795 955 L835 890" pathLength="1" />
    <circle id="sn-c1" class="sn-ink" cx="290" cy="1085" r="105" pathLength="1" />
    <circle id="sn-c2" class="sn-ink" cx="810" cy="1085" r="105" pathLength="1" />
  </svg>
  <div id="sn-word">PLAN</div>
</div>
