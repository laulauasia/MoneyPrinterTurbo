tl.fromTo("#pcb-head", { opacity: 0, y: -30 }, { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" }, 0);
tl.fromTo("#pcb-in", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.0, ease: "power1.in" }, 0.3);
tl.fromTo("#pcb-label", { opacity: 0.25 }, { opacity: 1, duration: 0.15, repeat: 4, yoyo: true }, 1.3);
tl.fromTo("#pcb-out", { strokeDashoffset: 1 }, { strokeDashoffset: 0, duration: 1.0, ease: "power1.in" }, 1.7);
tl.fromTo("#pcb-led", { opacity: 0.15, scale: 0.6, svgOrigin: "960 1320" }, { opacity: 1, scale: 1, duration: 0.2, repeat: 6, yoyo: true }, 2.7);
```
