name = "Shadow Puppet"
summary = "Dark jointed silhouettes behind a glowing amber screen, moving on rods like a puppet play."
direction = '''
- Surface: a backlit cloth screen: a radial gradient from warm light #ffd98a
  in the middle to deep amber #c9731f at the edges, with a dark vignette frame.
- Figures are flat silhouettes in near-black brown (#2a1408), built from
  separate parts joined at pivots (head, body, upper and lower limbs) and
  pierced with small cut-out holes (circles, slits, petals) that let the amber
  through. Thin straight rods (6px, same dark colour) may hang from hands.
- Scenery is the same silhouette language: a tree, a pavilion roof, a moon as
  a pale disc (#fff3cf), hills along the bottom edge.
- Type: Playfair Display 700, dark brown on the light part of the screen, at
  most three words.
- Motion: puppet theatre. Parts rotate stiffly around their joints (set
  svgOrigin at the pivot), figures slide in from the sides and bob slightly,
  never squash or stretch. The light flickers very gently.
'''
example = '''
```css
#sp-screen { position: absolute; inset: 0; background: radial-gradient(circle at 50% 46%, #ffd98a 0%, #f0a94a 45%, #c9731f 78%, #5a2c0c 100%); }
#sp-art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#sp-art .sp-dark { fill: #2a1408; }
#sp-art .sp-hole { fill: #f0a94a; }
#sp-art .sp-rod { fill: none; stroke: #2a1408; stroke-width: 7; }
#sp-moon { fill: #fff3cf; }
#sp-word { position: absolute; left: 0; top: 300px; width: 100%; text-align: center; font: 700 120px "Playfair Display", serif; color: #2a1408; letter-spacing: 6px; }
```
