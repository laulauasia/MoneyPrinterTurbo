name = "Pictogram Motion"
summary = "Signage-style pictogram people and icons, one colour on a flat ground. Clear like an airport sign."
direction = '''
- Surface: one flat signage colour: deep blue #003f88, green #00693e or
  yellow #ffcc00 (then draw in black). One colour per scene.
- Figures are pictograms: a round head that does not touch the body, a body of
  rounded bars for torso, arms and legs, all one solid fill (white #ffffff, or
  #111111 on yellow). No faces, no outlines, no detail. Objects are reduced
  the same way: a house is a square and a triangle.
- Compose like a sign: centred, large, with wide margins, optionally inside a
  rounded square or circle border 24px thick.
- Type: Inter 900, upper case, same colour as the pictogram, at most two words.
- Motion: pictograms move like signs come alive: limbs swing from the joint in
  steps, the figure walks across, an arrow slides and points. Use steps or
  power2.inOut; keep the figure moving until the end.
'''
example = '''
```css
#pg-sign { position: absolute; inset: 0; background: #003f88; }
#pg-frame { position: absolute; left: 140px; top: 520px; width: 800px; height: 800px; border: 26px solid #ffffff; border-radius: 90px; }
#pg-art { position: absolute; left: 140px; top: 520px; width: 800px; height: 800px; }
#pg-art .pg-part { fill: #ffffff; }
#pg-art .pg-limb { fill: none; stroke: #ffffff; stroke-width: 62; stroke-linecap: round; }
#pg-word { position: absolute; left: 0; top: 270px; width: 100%; text-align: center; font: 900 150px Inter, sans-serif; color: #ffffff; letter-spacing: 6px; }
```
