name = "Woodcut Print"
summary = "Bold black ink on rough paper with carved white lines and rays. Heavy, dramatic and handmade."
direction = '''
- Surface: rough off-white paper (#efe6d2).
- Ink: one black (#17130f), optionally one flat second block in ox-blood red
  #9b2226 or ochre #c98a1b. Large solid black masses are the base; detail is
  carved out of them as paper-coloured lines: parallel hatching, radiating
  sun rays, wavy water lines, wedge-shaped gouge marks. No greys, no gradients.
- Edges are rough: add an inline SVG filter (feTurbulence + feDisplacementMap,
  scale 6-10) to the ink group so outlines wobble like cut wood.
- Composition is bold and frontal: a big sun or moon disc, mountains, waves,
  figures as solid shapes, a thick black border round the whole image.
- Type: League Gothic or Oswald 700, upper case, black, at most three words.
- Motion: slow and weighty. Blocks stamp down (scale from 1.1 with a quick
  fade), rays turn slowly behind the subject, carved lines appear in a wipe.
'''
example = '''
```css
#wc-paper { position: absolute; inset: 0; background: #efe6d2; }
#wc-art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#wc-art .wc-ink { fill: #17130f; }
#wc-art .wc-cut { fill: none; stroke: #efe6d2; stroke-width: 12; stroke-linecap: round; }
#wc-sun { fill: #9b2226; }
#wc-frame { fill: none; stroke: #17130f; stroke-width: 26; }
#wc-word { position: absolute; left: 0; top: 250px; width: 100%; text-align: center; font: 400 200px "League Gothic", sans-serif; color: #17130f; letter-spacing: 8px; }
```
