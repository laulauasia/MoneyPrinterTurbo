name = "Red Paper-cut"
summary = "Chinese window paper-cut: one sheet of red paper with cut-out patterns on a warm cream ground."
direction = '''
- Surface: warm cream paper (#f7ecd4) or a gold-tinted cream; nothing else.
- Everything is cut from one colour of paper: festival red #c8102e. Detail is
  made by cutting holes that show the cream through: rows of small crescents,
  petals, dots, sawtooth edges and scallops. No outlines, no second colour
  except a little gold #d9a441 for a seal or a sun.
- Shapes are flat, symmetrical and connected, as if still one sheet: round
  medallions, a scalloped border ring, clouds as spirals, plants and animals as
  bold silhouettes with patterned insides.
- Type: Noto Sans JP 900 or Playfair Display 700 in red on cream (or cream on a
  red medallion), at most three words or one big character.
- Motion: paper behaviour: pieces unfold from a centre fold (scaleX from 0 on
  the centre line), rotate into place like a snowflake opening, or flutter down.
  Afterwards the medallion turns slowly and pieces sway a few degrees.
'''
example = '''
