#uk-art .uk-line { stroke: #22252b; stroke-width: 5; stroke-linejoin: round; }
#uk-sun { fill: #d1372d; }
#uk-fuji { fill: #1f3a5f; }
#uk-cap { fill: #f2e6c9; }
#uk-wave { fill: #7ba7bc; }
#uk-foam { fill: #f2e6c9; }
#uk-tag { position: absolute; left: 110px; top: 470px; width: 150px; height: 420px; background: #d1372d; border: 5px solid #22252b; }
#uk-word { position: absolute; left: 0; top: 280px; width: 100%; text-align: center; font: 700 120px "Playfair Display", serif; color: #1f3a5f; letter-spacing: 6px; }
```
