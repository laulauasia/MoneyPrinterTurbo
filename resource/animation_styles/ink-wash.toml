#iw-mid { left: 380px; top: 860px; width: 760px; height: 700px; border-radius: 50%; opacity: 0.32; filter: blur(18px); }
#iw-near { left: -140px; top: 1060px; width: 760px; height: 640px; border-radius: 50%; opacity: 0.72; filter: blur(12px); }
#iw-mist { position: absolute; left: -300px; top: 1290px; width: 1680px; height: 700px; background: #f3efe4; filter: blur(60px); }
#iw-sun { position: absolute; left: 700px; top: 520px; width: 150px; height: 150px; border-radius: 50%; background: #c8281e; opacity: 0.75; filter: blur(3px); }
#iw-art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#iw-art .iw-stroke { fill: none; stroke: #1a1a1a; stroke-width: 9; stroke-linecap: round; stroke-dasharray: 1; }
#iw-word { position: absolute; left: 110px; top: 290px; font: 700 110px "Playfair Display", serif; color: #1a1a1a; }
#iw-seal { position: absolute; left: 116px; top: 450px; width: 84px; height: 84px; background: #c8281e; border-radius: 8px; }
