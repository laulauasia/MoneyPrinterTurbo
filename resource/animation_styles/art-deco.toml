name = "Art Deco"
summary = "Gold lines on deep navy: sunbursts, fans and stepped frames. 1920s luxury."
direction = '''
- Surface: deep navy (#0d1b2a) or black-green (#0b2b26).
- Palette: metallic gold drawn as flat #d4af37 with a lighter #f1d27a for
  highlights; cream #f5ecd6 for type. Nothing else.
- Ornament is symmetrical and geometric: sunburst rays from a centre, fan and
  scallop shapes, stepped ziggurat frames, chevrons, thin double lines (4px and
  8px) around the content. Compose on the vertical centre line.
- Type: Playfair Display 700, upper case, wide letter-spacing (10-16px), cream
  or gold, centred, at most three words.
- Motion: elegant and symmetrical. Rays fan out from the centre, frame lines
  draw from the middle outwards on both sides at once, type rises with a slow
  fade. power2.inOut, nothing bouncy. Afterwards the sunburst turns slowly.
'''
example = '''
```css
#ad-page { position: absolute; inset: 0; background: #0d1b2a; }
#ad-art { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; }
#ad-art .ad-line { fill: none; stroke: #d4af37; stroke-width: 6; stroke-dasharray: 1; }
#ad-art .ad-ray { stroke: #f1d27a; stroke-width: 8; stroke-linecap: square; }
#ad-word { position: absolute; left: 0; top: 330px; width: 100%; text-align: center; font: 700 110px "Playfair Display", serif; color: #f5ecd6; letter-spacing: 14px; }
#ad-core { fill: #d4af37; }
```
