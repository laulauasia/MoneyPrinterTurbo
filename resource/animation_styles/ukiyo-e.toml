name = "Ukiyo-e"
summary = "Japanese woodblock print: flat indigo, vermilion and cream with fine dark outlines, waves and a red sun."
direction = '''
- Surface: aged cream paper (#f2e6c9), with a soft band of colour fading down
  from the top edge (a linear gradient of indigo #1f3a5f to transparent over the top 200px,
  the printmaker's bokashi; keep type below it), the only gradient allowed.
- Palette: Prussian indigo #1f3a5f, pale blue #7ba7bc, vermilion #d1372d,
  ochre #d9a441, pine green #4a6b4f, all flat. Every shape has a fine dark
  outline (#22252b, 4-5px) of even weight.
- Subjects are stylised nature: a flat red sun disc, a mountain as a simple
  cone with a pale cap, waves built from repeated curls and claw-like foam,
  clouds as long horizontal bands with rounded ends, pines, boats.
- Compose in flat layers, far to near, with large calm areas of paper. Add a
  small vertical cartouche (a red or cream rectangle with a dark outline).
- Type: Playfair Display 700 or Noto Sans JP 700, indigo, at most three
  words, optionally inside the cartouche.
- Motion: layers slide sideways at different speeds like sliding screens;
  waves rock; the sun rises slowly. Gentle sine eases, no bounce.
'''
example = '''
