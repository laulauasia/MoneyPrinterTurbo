name = "Isometric Infographic"
summary = "Little isometric blocks and platforms in soft colours that stack and connect to explain a process."
direction = '''
- Surface: a soft flat background (#eef2f7 or #f7f3ec).
- Objects are isometric solids drawn as inline SVG polygons with three faces:
  top lightest, left mid, right darkest of one hue. Use 30-degree axes: move 2
  across for 1 down. Hues: blue #4c7df0, teal #2bb3a3, coral #f2695c, amber
  #f5b63f; give each face a tint of its hue by hand.
- Build small scenes from cubes, slabs, cylinders approximated by stacks,
  conveyor strips and thin dotted connector paths between platforms. Add a
  flat soft ground shadow (rgba(0,0,0,0.12) ellipse or rhombus) under objects.
- Type: Poppins 700, dark slate #1f2a44, at most three words, set flat above.
- Motion: blocks drop into place one after another with a small bounce,
  connectors draw, a token travels along a path from one platform to the next.
  Then blocks keep bobbing a few pixels.
'''
example = '''
```css
#iso-page { position: absolute; inset: 0; background: #eef2f7; }
#iso-word { position: absolute; left: 0; top: 260px; width: 100%; text-align: center; font: 700 120px Poppins, sans-serif; color: #1f2a44; }
#iso-art { position: absolute; left: 40px; top: 480px; width: 1000px; height: 900px; }
#iso-path { fill: none; stroke: #1f2a44; stroke-width: 6; stroke-dasharray: 0.02 0.03; }
```
